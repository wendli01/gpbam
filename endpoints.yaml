# LLM Endpoint Routing Configuration
# ------------------------------------
# Each named endpoint needs a `base_url` and `token_env` (name of the env var holding the key).
# Models not listed under `models:` fall through to `default_endpoint`.
# Add a `model_id` override when the endpoint expects a different identifier than the one
# used in this codebase (e.g. native OpenAI API needs "gpt-5-mini", not "openai/gpt-5-mini").

endpoints:
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    token_env: "openrouter_api"

  nhr_fau:
    base_url: "https://hub.nhr.fau.de/api/llmgw/v1"
    token_env: "nhr_fau_api"

  innkube:
    base_url: "https://llms.innkube.fim.uni-passau.de"
    token_env: "innkube_api"

  openai_direct:
    base_url: "https://api.openai.com/v1"
    token_env: "OPENAI_API_KEY"

  anthropic_direct:
    base_url: "https://api.anthropic.com/v1"
    token_env: "ANTHROPIC_API_KEY"

  deepseek_direct:
    base_url: "https://api.deepseek.com/v1"
    token_env: "DEEPSEEK_API_KEY"

  google_direct:
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    token_env: "GOOGLE_API_KEY"

  mistral_direct:
    base_url: "https://api.mistral.ai/v1"
    token_env: "MISTRAL_API_KEY"

  local_vllm:
    base_url: "http://localhost:8000/v1"
    token_env: "VLLM_API_KEY"   # set VLLM_API_KEY=EMPTY in .env for local servers

# Default endpoint used for any model not explicitly listed below.
default_endpoint: openrouter

# Per-model routing.
# Keys are the model IDs as used in config.py / experiment scripts.
# `endpoint`  — which named endpoint above to use.
# `model_id`  — optional; overrides the model identifier sent to the API.
#               Use this when a native endpoint expects a different format
#               (e.g. strip the "openai/" prefix for the real OpenAI API).
#
# Uncomment / edit entries to reroute a model.  Everything else stays on `default_endpoint`.
models:
