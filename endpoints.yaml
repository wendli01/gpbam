  # "openai/gpt-5.4-nano-2026-03-17":
  #   endpoint: openai_direct
  #   model_id: "gpt-5.4-nano-2026-03-17"

  # --- Anthropic direct ---
  # "anthropic/claude-haiku-4.5":
